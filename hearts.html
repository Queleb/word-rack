<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Room">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1916">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Hearts</title>
<script>
  (function(){ let t=null; try{ t=localStorage.getItem("wordrack-theme"); }catch(e){}
    if(!t) t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
    document.documentElement.dataset.theme=t; })();
</script>
<style>
  :root{
    --bg:#f4efe6; --ink:#2b2621; --muted:#7a6f63; --line:#d6c9b1; --panel:#fff8ec; --accent:#2f6f5e;
    --felt:#2f6b55; --feltEdge:#25574a; --feltInk:#eaf3ee; --card:#fffdf8; --cardEdge:#d9cfbf; --red:#c0392b; --black:#24211d;
  }
  :root[data-theme=dark]{
    --bg:#1b1916; --ink:#efe7da; --muted:#a39886; --line:#3e3933; --panel:#26231f; --accent:#3d8a75;
    --felt:#1f4a3b; --feltEdge:#183a2f; --feltInk:#d9ebe3; --card:#f4efe5; --cardEdge:#b9ad99;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation}
  #app{max-width:540px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding:calc(6px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left))}
  .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .top h1{flex:1;margin:0;font-size:20px;text-align:center}
  .iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;font-size:15px;font-weight:600;padding:8px 11px;text-decoration:none}
  #table{position:relative;flex:1;min-height:330px;background:radial-gradient(ellipse at center,var(--felt) 55%,var(--feltEdge));border-radius:18px;
    display:grid;grid-template-columns:.75fr 2fr .75fr;grid-template-rows:auto 1fr auto;grid-template-areas:". n ." "w t e" ". s .";padding:8px;color:var(--feltInk)}
  .seat{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;text-align:center;gap:3px;padding:4px;border-radius:12px}
  .seat.turn{box-shadow:0 0 0 2px #f5d562 inset}
  .seat .nm{font-weight:700;font-size:14px}
  .av{width:44px;height:44px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #f3e9d8,0 2px 6px rgba(0,0,0,.3)}
  .seat.turn .av{box-shadow:0 0 0 3px #f5d562,0 2px 6px rgba(0,0,0,.3)}
  .seat .sc{font-size:12px;opacity:.9}
  .seat .sc b{font-size:16px}
  .backs{display:flex;height:26px;align-items:center}
  .back{width:16px;height:24px;border-radius:3px;background:repeating-linear-gradient(45deg,#8d3b32 0 3px,#a8483d 3px 6px);border:1.5px solid #f3e9d8;margin-left:-12px}
  .back:first-child{margin-left:0}
  #seat1{grid-area:w} #seat2{grid-area:n} #seat3{grid-area:e} #seat0{grid-area:s}
  #trick{grid-area:t;position:relative;min-height:215px}
  #trick .card{position:absolute;left:50%;top:50%;transition:transform var(--fly,360ms) ease,opacity var(--fly,360ms) ease}
  #trick .p0{transform:translate(-50%,6%)} #trick .p1{transform:translate(-152%,-50%)}
  #trick .p2{transform:translate(-50%,-106%)} #trick .p3{transform:translate(52%,-50%)}
  #trick .card.win{box-shadow:0 0 0 3px #f5d562,0 4px 10px rgba(0,0,0,.35)}
  .tag{display:inline-block;background:rgba(0,0,0,.25);padding:1px 7px;border-radius:9px;font-size:11px;margin-top:2px}
  #msg{min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;padding:6px 4px;line-height:1.3}
  #hand{position:relative;height:calc(min(17vw,78px) * 1.42 + 22px);margin-top:2px}
  .card{width:min(17vw,78px);height:calc(min(17vw,78px) * 1.42);background:var(--card);border:1px solid var(--cardEdge);border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,.2);position:relative;color:var(--black);user-select:none;-webkit-user-select:none}
  .card.red{color:var(--red)}
  .card.backface{border:3px solid #f3e9d8}
  .card .cr{position:absolute;left:5px;top:3px;font-weight:800;font-size:min(5vw,22px);line-height:1}
  .card .cs{position:absolute;left:5px;top:calc(3px + min(5vw,22px));font-size:min(4.4vw,19px);line-height:1}
  .card .cb{position:absolute;right:6px;bottom:4px;font-size:min(8.5vw,38px);line-height:1}
  #trick .card{width:min(14vw,64px);height:calc(min(14vw,64px) * 1.42)}
  #trick .card .cr{font-size:min(4.3vw,19px)} #trick .card .cs{top:calc(3px + min(4.3vw,19px));font-size:min(3.8vw,16px)} #trick .card .cb{font-size:min(7vw,30px)}
  #hand .card{position:absolute;bottom:0;transition:transform .12s ease}
  #hand .card.sel{transform:translateY(-18px);box-shadow:0 0 0 3px var(--accent),0 4px 10px rgba(0,0,0,.25)}
  #hand .card.dim{filter:brightness(.62) saturate(.6)}
  #hand .card.got{transform:translateY(-16px);box-shadow:0 0 0 3px #f5d562,0 0 18px 4px rgba(245,213,98,.75);animation:glow .9s ease-in-out 3 alternate}
  @keyframes glow{from{box-shadow:0 0 0 3px #f5d562,0 0 6px 1px rgba(245,213,98,.4)}to{box-shadow:0 0 0 3px #f5d562,0 0 22px 6px rgba(245,213,98,.9)}}
  #hand .card.new::after{content:"";position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  #actions{display:flex;gap:8px;margin-top:8px;min-height:46px}
  .btn{flex:1;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:15px;font-weight:600;color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.45}
  .overlay{position:fixed;inset:0;background:rgba(20,18,15,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .hidden{display:none}
  .dcard{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
  .dcard h1{margin:0 0 4px;font-size:26px} .dcard h2{margin:0 0 10px;font-size:19px}
  .dcard p{margin:6px 0;color:var(--muted);font-size:14px;line-height:1.4}
  .lbl{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  .seg{display:grid;gap:6px}
  .seg button{padding:10px 4px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:600;color:var(--ink)}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stack{display:grid;gap:8px;margin-top:16px}
  .res{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
  .res td,.res th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
  .res td:first-child,.res th:first-child{text-align:left}
  .res th{font-size:12px;color:var(--muted);font-weight:600}
  .brand{display:flex;align-items:center;gap:12px}
  .cat{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #ead39f,0 2px 8px rgba(0,0,0,.25);flex:0 0 auto}
  .cat.big{width:120px;height:120px;display:block;margin:4px auto 10px}
  textarea{width:100%;height:110px;font-size:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a class="iconbtn" href="./">← Games</a>
    <h1 id="title">Hearts</h1>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
  </div>
  <div id="table">
    <div class="seat" id="seat2"></div>
    <div class="seat" id="seat1"></div>
    <div id="trick"></div>
    <div class="seat" id="seat3"></div>
    <div class="seat" id="seat0"></div>
  </div>
  <div id="msg"></div>
  <div id="hand"></div>
  <div id="actions"></div>
</div>
<div id="dialog" class="overlay hidden"><div class="dcard" id="dlg"></div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; }
const SUITS=["C","D","S","H"], SYM={C:"♣",D:"♦",S:"♠",H:"♥"};
const RN={11:"J",12:"Q",13:"K",14:"A"}, rs=r=>RN[r]||String(r);
const cid=c=>c.r+c.s;
const isQS=c=>c.s==="S"&&c.r===12;
const pts=c=>c.s==="H"?1:(isQS(c)?13:0);
const CATS={Squeex:"cat-squeex.jpg",Sushi:"cat-sushi.jpg",Mojito:"cat-mojito.jpg",Glorg:"cat-glorg.jpg"};
const LEVELS=["Easy","Medium","Hard","Expert","Mixed"];
const BACKS=[["#8d3b32","#a8483d"],["#2c4f86","#3a64a3"],["#5b3a86","#7049a3"],["#b0601f","#c97a33"],["#1f6f74","#2c878c"],["#a33d6b","#bd5282"],["#4a4a4a","#5e5e5e"]];
const backBg=p=>{ const b=(G&&G.backs)?BACKS[G.backs[p]]:BACKS[0]; return `repeating-linear-gradient(45deg,${b[0]} 0 3px,${b[1]} 3px 6px)`; };
const nm=p=>p===0?"You":(G&&G.names?G.names[p]:["You","West","North","East"][p]);
const lvOf=p=>G.levels?G.levels[p]:G.level;
const SPEEDS={slow:{think:1400,fly:480,linger:2400,after:600,hand:2000,got:3600},
              normal:{think:850,fly:360,linger:1600,after:380,hand:1300,got:2800},
              fast:{think:380,fly:220,linger:850,after:160,hand:650,got:1900}};
const SPEED_KEY="hearts-speed";
let speed=(()=>{ try{ return localStorage.getItem(SPEED_KEY)||"normal"; }catch(e){ return "normal"; } })();
const T_=()=>SPEEDS[speed]||SPEEDS.normal;
function setSpeed(v){ speed=v; try{ localStorage.setItem(SPEED_KEY,v); }catch(e){} document.documentElement.style.setProperty("--fly",T_().fly+"ms"); }
document.documentElement.style.setProperty("--fly",T_().fly+"ms");
const PASSNAME=["left","right","across","hold"];
const SAVE_KEY="hearts-save-v1", STATS_KEY="hearts-stats-v1", THEME_KEY="wordrack-theme";
const maxBy=(a,f)=>a.reduce((b,x)=>f(x)>f(b)?x:b);
const minBy=(a,f)=>a.reduce((b,x)=>f(x)<f(b)?x:b);

let G=null, sel=new Set(), busy=false, flashUntil=0;

// ---------- Storage ----------
function readLocal(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function writeLocal(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function save(){ writeLocal(SAVE_KEY,G); }
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

// ---------- Game flow ----------
function newGame(level,target){
  const names=shuffle(Object.keys(CATS)).slice(0,3);
  const levels= level===4 ? [null,...shuffle([0,1,2,3]).slice(0,3)] : [null,level,level,level];
  G={level,levels,names:["You",...names],backs:shuffle(BACKS.map((_,i)=>i)).slice(0,4),target,scores:[0,0,0,0],handNo:0,history:[],over:false};
  startHand();
}
function startHand(){
  const deck=[]; for(const s of SUITS) for(let r=2;r<=14;r++) deck.push({s,r});
  shuffle(deck);
  G.hands=[0,1,2,3].map(i=>deck.slice(i*13,i*13+13));
  G.hands.forEach(sortHand);
  G.dir=G.handNo%4; G.trick=[]; G.lastTrick=null; G.handPts=[0,0,0,0]; G.tricks=0; G.broken=false;
  G.played=[]; G.voids=[{},{},{},{}]; G.received=[]; G.passKnown=null;
  sel.clear();
  G.phase = G.dir===3 ? "play" : "pass";
  if (G.phase==="play") beginPlay(); else { save(); render(); setMsg(`Choose 3 cards to pass <b>${PASSNAME[G.dir]}</b>.`); }
}
function sortHand(h){ h.sort((a,b)=>SUITS.indexOf(a.s)-SUITS.indexOf(b.s)||a.r-b.r); }
const passTo=(i,d)=>d===0?(i+1)%4:d===1?(i+3)%4:(i+2)%4;
function doPass(){
  if (sel.size!==3 || busy) return;
  busy=true; render();
  const d=Math.round(T_().fly*1.7), tgt=passTo(0,G.dir), src=[3,1,2][G.dir];
  const tp=seatPoint(tgt), sp=seatPoint(src), hr=$("hand").getBoundingClientRect();
  const fly=(el,from,dx,dy,extra)=>{
    Object.assign(el.style,{position:"fixed",left:from.left+"px",top:from.top+"px",margin:"0",zIndex:"50",transition:`transform ${d}ms ease, opacity ${d}ms ease`});
    document.body.appendChild(el); el.getBoundingClientRect();
    el.style.transform=`translate(${dx}px,${dy}px) ${extra}`;
  };
  // your 3 cards slide to the player you're passing to
  const outs=[...$("hand").children].filter(e=>sel.has(e.dataset.id)).map((e,i)=>{
    const r=e.getBoundingClientRect(), c=e.cloneNode(true); c.className=c.className.replace(/\b(sel|dim|got|new)\b/g,""); e.style.visibility="hidden";
    fly(c,r,tp.x-(r.left+r.width/2),tp.y-(r.top+r.height/2),`scale(.45) rotate(${(i-1)*10}deg)`); c.style.opacity="0.15"; return c; });
  setTimeout(()=>{
    outs.forEach(c=>c.remove());
    // 3 face-down cards come back from the player passing to you
    const cw=outs[0]?outs[0].offsetWidth||64:64;
    const ins=[0,1,2].map(i=>{
      const c=document.createElement("div"); c.className="card backface"; c.style.background=backBg(src);
      const w=Math.min(78,innerWidth*0.17), h=w*1.42;
      const from={left:sp.x-w/2, top:sp.y-h/2};
      c.style.width=w+"px"; c.style.height=h+"px"; c.style.transformOrigin="center";
      fly(c,from,(hr.left+hr.width/2+(i-1)*w*0.7)-sp.x,(hr.top+hr.height/2)-sp.y,`rotate(${(i-1)*6}deg)`); return c; });
    setTimeout(()=>{ ins.forEach(c=>c.remove()); busy=false; commitPass(); }, d+60);
  }, d+60);
}
function commitPass(){
  const out=[0,1,2,3].map(p=> p===0 ? G.hands[0].filter(c=>sel.has(cid(c))) : cpuPass(p));
  out.forEach((cards,p)=>{ G.hands[p]=G.hands[p].filter(c=>!cards.some(x=>cid(x)===cid(c))); });
  G.passKnown=out.map((cards,p)=>({to:passTo(p,G.dir),ids:cards.map(cid)}));
  out.forEach((cards,p)=>{ const t=passTo(p,G.dir); G.hands[t].push(...cards); if (t===0) G.received=cards.map(cid); });
  G.hands.forEach(sortHand); sel.clear();
  const fromP=[3,1,2][G.dir], from=nm(fromP); // who passed to you
  flashUntil=Date.now()+T_().got; setTimeout(render,T_().got+30);
  G.phase="play"; G.note=`You got ${G.received.map(x=>label(x)).join(", ")} from ${from}.`; beginPlay();
}
function label(id){ const r=parseInt(id), s=id.slice(-1); return rs(r)+SYM[s]; }
function beginPlay(){
  G.leader=G.turn=G.hands.findIndex(h=>h.some(c=>c.s==="C"&&c.r===2));
  save(); render(); step();
}
function turnText(){
  if (G.turn===0) return G.trick.length ? "Your turn." : (G.tricks===0 ? "Your lead. Play the 2♣." : "Your lead.");
  return `${nm(G.turn)}'s turn…`;
}
function showTurn(){ setMsg((G.note?G.note+"<br>":"")+turnText()); }
function legal(p){
  const h=G.hands[p], T=G.trick;
  if (!T.length){
    if (G.tricks===0) return h.filter(c=>c.s==="C"&&c.r===2);
    if (!G.broken){ const nh=h.filter(c=>c.s!=="H"); if (nh.length) return nh; }
    return h.slice();
  }
  const lead=T[0].c.s, follow=h.filter(c=>c.s===lead);
  if (follow.length) return follow;
  if (G.tricks===0){ const safe=h.filter(c=>!pts(c)); if (safe.length) return safe; }
  return h.slice();
}
function step(){
  if (G.phase!=="play" || G.trick.length===4) return;
  render(); showTurn();
  if (G.turn!==0){
    busy=true;
    setTimeout(()=>{ busy=false; if (G && G.phase==="play" && G.turn!==0 && G.trick.length<4) playCard(G.turn,cpuChoose(G.turn)); }, T_().think);
  }
}
function playCard(p,c){
  G.hands[p]=G.hands[p].filter(x=>cid(x)!==cid(c));
  if (G.trick.length && c.s!==G.trick[0].c.s) G.voids[p][G.trick[0].c.s]=true;
  G.trick.push({p,c}); G.played.push(cid(c));
  if (c.s==="H") G.broken=true;
  if (p===0){ G.received=[]; G.note=""; sel.clear(); flashUntil=0; }
  G.turn=(p+1)%4;
  save(); render(); flyIn(p);
  if (G.trick.length===4) finishTrick(); else step();
}
function finishTrick(){
  busy=true; render();
  const w=trickWinner(), tp=G.trick.reduce((s,t)=>s+pts(t.c),0);
  setTimeout(()=>{
    markWinner(w);
    setMsg(tp ? `${w===0?"You take":nm(w)+" takes"} ${tp} point${tp>1?"s":""}.` : `${w===0?"You win":nm(w)+" wins"} the trick.`);
    setTimeout(()=>collect(w,()=>{ busy=false; resolveTrick(); }), T_().linger);
  }, T_().fly);
}
function trickWinner(){ const lead=G.trick[0].c.s; return G.trick.filter(t=>t.c.s===lead).reduce((a,b)=>b.c.r>a.c.r?b:a).p; }
function resolveTrick(){
  const w=trickWinner(), p=G.trick.reduce((s,t)=>s+pts(t.c),0);
  G.handPts[w]+=p; G.tricks++; G.lastTrick=G.trick; G.trick=[]; G.leader=G.turn=w;
  save(); render();
  if (G.tricks===13){ setMsg("That's the hand!"); busy=true; setTimeout(()=>{ busy=false; endHand(); }, T_().hand); }
  else { busy=true; setTimeout(()=>{ busy=false; step(); }, T_().after); }
}
// ---- light animations: a card slides from its player to the table, then to the trick winner ----
function seatPoint(p){
  const el = p===0 ? $("hand") : $("seat"+p);
  const r=el.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2};
}
function flyIn(p){
  const el=[...$("trick").children].find(x=>x.classList.contains("p"+p)); if (!el) return;
  const r=el.getBoundingClientRect(), from=seatPoint(p);
  const dx=from.x-(r.left+r.width/2), dy=from.y-(r.top+r.height/2);
  const end=getComputedStyle(el).transform;
  el.style.transition="none"; el.style.transform=`translate(${dx}px,${dy}px) ${end==="none"?"":end}`; el.style.opacity="0.3";
  el.getBoundingClientRect();
  el.style.transition=""; el.style.transform=""; el.style.opacity="";
}
function collect(w,done){
  const to=seatPoint(w), cards=[...$("trick").children].filter(x=>x.classList.contains("card"));
  for (const el of cards){
    const r=el.getBoundingClientRect(), end=getComputedStyle(el).transform;
    el.style.transform=`translate(${to.x-(r.left+r.width/2)}px,${to.y-(r.top+r.height/2)}px) ${end==="none"?"":end} scale(.6)`;
    el.style.opacity="0";
  }
  setTimeout(done, cards.length?T_().fly:0);
}
function endHand(){
  const shooter=G.handPts.indexOf(26);
  const add=shooter>=0 ? G.handPts.map((_,i)=>i===shooter?0:26) : G.handPts.slice();
  add.forEach((v,i)=>G.scores[i]+=v);
  G.history.push({pts:add,moon:shooter});
  G.phase="handEnd";
  if (Math.max(...G.scores)>=G.target){ G.over=true; G.phase="over"; G.result=recordResult(shooter===0); }
  else if (shooter===0) bumpStat("moons");
  save(); render(); showHandSummary(shooter,add);
}
function nextHand(){ G.handNo++; startHand(); }

// ---------- CPU ----------
function unseen(p){ const known=new Set([...G.played,...G.hands[p].map(cid),...G.trick.map(t=>cid(t.c))]); const out=[]; for(const s of SUITS) for(let r=2;r<=14;r++) if(!known.has(r+s)) out.push({s,r}); return out; }
function moonThreat(p){
  const tot=G.handPts.reduce((a,b)=>a+b,0)+G.trick.reduce((s,t)=>s+pts(t.c),0);
  if (tot<8) return -1;
  for (let q=0;q<4;q++) if (q!==p && G.handPts[q]===G.handPts.reduce((a,b)=>a+b,0) && G.handPts[q]>=8) return q;
  return -1;
}
function cpuPass(p){
  const h=G.hands[p], lv=lvOf(p);
  if (lv===0) return shuffle(h.slice()).slice(0,3);
  const cnt=s=>h.filter(x=>x.s===s).length;
  const lowSp=h.filter(x=>x.s==="S"&&x.r<12).length;
  const val=c=>{
    if (lv===1) return c.r+(c.s==="H"?0.5:0)+(isQS(c)?6:0);
    let v=c.r;
    if (c.s==="S"){ if (c.r>=12) v=(lv===3&&lowSp>=4)?1:(c.r===12?40:30+c.r); else v=-5; }
    if (c.s==="H" && c.r>=10) v+=4;
    if ((c.s==="C"||c.s==="D") && cnt(c.s)<=2) v+=8;
    return v;
  };
  return h.slice().sort((a,b)=>val(b)-val(a)).slice(0,3);
}
function cpuChoose(p){
  const L=legal(p), lv=lvOf(p);
  if (L.length===1) return L[0];
  if (lv>=3 && !G.sim) return expertMC(p,L);
  if (lv===0 || (lv===1 && Math.random()<0.25)) return L[rnd(L.length)];
  if (!G.trick.length) return chooseLead(p,L,lv);
  const lead=G.trick[0].c.s;
  return L[0].s===lead ? chooseFollow(p,L,lv) : chooseDiscard(p,L,lv);
}
// ---------- Expert: card counting + quick look-ahead ----------
// Deals the unseen cards to the other players in ways that fit everything Expert knows
// (who is out of which suit, what it passed), plays each option out with solid play, keeps the safest.
function sampleHands(p){
  const others=[1,2,3].map(k=>(p+k)%4), U=unseen(p);
  const need={}; others.forEach(o=>need[o]=G.hands[o].length);
  for (let attempt=0; attempt<12; attempt++){
    const hands={}; others.forEach(o=>hands[o]=[]);
    let pool=U.slice(), ok=true;
    const pk=G.passKnown&&G.passKnown[p];
    if (pk){ pool=pool.filter(c=>{ if (pk.ids.includes(cid(c)) && hands[pk.to].length<need[pk.to]){ hands[pk.to].push(c); return false; } return true; }); }
    shuffle(pool);
    for (const c of pool){
      const elig=others.filter(o=>hands[o].length<need[o] && (attempt>8 || !G.voids[o][c.s]));
      if (!elig.length){ ok=false; break; }
      hands[elig[rnd(elig.length)]].push(c);
    }
    if (ok) return hands;
  }
  return null;
}
function simPlay(c){
  const p=G.turn;
  G.hands[p]=G.hands[p].filter(x=>x!==c && cid(x)!==cid(c));
  if (G.trick.length && c.s!==G.trick[0].c.s) G.voids[p][G.trick[0].c.s]=true;
  G.trick.push({p,c}); G.played.push(cid(c)); if (c.s==="H") G.broken=true;
  G.turn=(p+1)%4;
  if (G.trick.length===4){ const w=trickWinner(); G.handPts[w]+=G.trick.reduce((s,t)=>s+pts(t.c),0); G.tricks++; G.trick=[]; G.turn=w; }
}
function expertMC(p,L){
  const real=G, budget=140, samples=Math.max(10,Math.floor(budget/L.length));
  const cost=new Map(L.map(c=>[cid(c),0]));
  try{
    for (let k=0;k<samples;k++){
      G=real; const dealt=sampleHands(p); if (!dealt) continue;
      for (const c of L){
        G={...real, sim:true, levels:[2,2,2,2], level:2,
           hands:real.hands.map((h,i)=>i===p?h.slice():dealt[i].slice()),
           trick:real.trick.slice(), played:real.played.slice(), voids:real.voids.map(v=>({...v})), handPts:real.handPts.slice(), turn:p};
        simPlay(c);
        let guard=60; while (G.tricks<13 && guard--) simPlay(cpuChoose(G.turn));
        const sh=G.handPts.indexOf(26);
        cost.set(cid(c), cost.get(cid(c)) + (sh===p ? -20 : sh>=0 ? 26 : G.handPts[p]));
      }
    }
  } finally { G=real; }
  return minBy(L,c=>cost.get(cid(c)));
}
function expertLead(p,L){
  const U=unseen(p), qsUnseen=U.some(isQS), haveQS=G.hands[p].some(isQS);
  const others=[1,2,3].map(k=>(p+k)%4);
  let best=L[0], bv=Infinity;
  for (const c of L){
    const hi=U.filter(x=>x.s===c.s&&x.r>c.r).length, lo=U.filter(x=>x.s===c.s&&x.r<c.r).length;
    const voids=others.filter(o=>G.voids[o][c.s]).length;
    let v=0;
    if (isQS(c)) v+= hi ? 3 : 40;
    if (hi+lo===0) v+=8;                                         // nobody can follow: I win and eat dumps
    else if (hi===0) v+=4+(c.s==="H"?3:0)+voids*(qsUnseen&&!haveQS?9:2);   // certain winner
    else v+=(lo===0?-2:0)+voids*(qsUnseen?3:1)+(c.r/14)*2*(lo/(hi+lo));    // risk grows with rank
    if (c.s==="S" && qsUnseen && !haveQS){ if (c.r<12) v-=3; else v+=20; }   // flush the Q♠ safely
    if (c.s==="S" && haveQS && !isQS(c)) v+=2;                    // keep spades guarding my Q♠
    if (c.s==="H") v+=1;
    if (v<bv){ bv=v; best=c; }
  }
  return best;
}
function chooseLead(p,L,lv){
  if (lv>=3) return expertLead(p,L);
  const h=G.hands[p], qsGone=G.played.includes("12S"), haveQS=h.some(isQS);
  if (lv>=2 && !qsGone && !haveQS){ const sp=L.filter(c=>c.s==="S"&&c.r<12); if (sp.length) return maxBy(sp,c=>c.r); }
  let cand=L.filter(c=>!isQS(c) && !(lv>=2 && !qsGone && c.s==="S" && c.r>12));
  if (!cand.length) cand=L;
  const U=unseen(p);
  return minBy(cand,c=>{
    let v=c.r + (c.s==="H"?3:0);
    if (lv>=2) for (let q=1;q<4;q++){ const o=(p+q)%4; if (G.voids[o][c.s]) v+=10; }
    if (lv>=3){ const lower=U.filter(x=>x.s===c.s&&x.r<c.r).length, higher=U.filter(x=>x.s===c.s&&x.r>c.r).length; if (!lower && higher) v-=4; if (!higher) v+=6; }
    return v;
  });
}
function chooseFollow(p,L,lv){
  const T=G.trick, lead=T[0].c.s, win=Math.max(...T.filter(t=>t.c.s===lead).map(t=>t.c.r));
  const winner=trickWinnerPartial(), last=T.length===3, tp=T.reduce((s,t)=>s+pts(t.c),0);
  const nonQ=L.filter(c=>!isQS(c));
  if (lv>=3){ const q=moonThreat(p); if (q>=0 && winner===q){ const over=nonQ.filter(c=>c.r>win); if (over.length) return minBy(over,c=>c.r); } }
  if (G.tricks===0) return maxBy(nonQ.length?nonQ:L,c=>c.r);       // first trick carries no points
  if (lead==="S" && lv>=2){ const qs=L.find(isQS); if (qs && win>12) return qs; }
  const under=L.filter(c=>c.r<win);
  if (under.length) return maxBy(under,c=>c.r);                    // duck as high as possible
  if (last && (tp===0 || lv<2)) return maxBy(nonQ.length?nonQ:L,c=>c.r);
  if (last) return maxBy(nonQ.length?nonQ:L,c=>c.r);
  if (lv>=3 && tp===0 && lead!=="H"){
    // Counting: if nobody after me can dump the Q♠ or hearts here, it's safe to shed my highest card
    const after=[1,2,3].map(k=>(p+k)%4).slice(0,3-T.length);
    const U=unseen(p), qsOut=U.some(isQS);
    const dumpRisk=after.some(o=>G.voids[o][lead]) || (lead==="S" && qsOut);
    if (!dumpRisk) return maxBy(nonQ.length?nonQ:L,c=>c.r);
  }
  return minBy(nonQ.length?nonQ:L,c=>c.r);
}
function trickWinnerPartial(){ const lead=G.trick[0].c.s; return G.trick.filter(t=>t.c.s===lead).reduce((a,b)=>b.c.r>a.c.r?b:a).p; }
function chooseDiscard(p,L,lv){
  if (lv>=3){ const q=moonThreat(p); if (q>=0 && trickWinnerPartial()===q){ const np=L.filter(c=>!pts(c)); if (np.length) return maxBy(np,c=>c.r); } }
  const qs=L.find(isQS); if (qs) return qs;
  if (lv>=2 && !G.played.includes("12S")){ const hi=L.filter(c=>c.s==="S"&&c.r>12); if (hi.length) return maxBy(hi,c=>c.r); }
  const hs=L.filter(c=>c.s==="H"); if (hs.length) return maxBy(hs,c=>c.r);
  if (lv>=3){ const cnt=s=>G.hands[p].filter(x=>x.s===s).length; return maxBy(L,c=>c.r-2*cnt(c.s)+(cnt(c.s)===1?6:0)); }
  if (lv>=2){ const cnt=s=>G.hands[p].filter(x=>x.s===s).length; return maxBy(L,c=>c.r-2*cnt(c.s)); }
  return maxBy(L,c=>c.r);
}

// ---------- Rendering ----------
function setMsg(h){ $("msg").innerHTML="<span>"+h+"</span>"; }
function cardHTML(c,cls){ const red=c.s==="H"||c.s==="D"; return `<div class="card ${red?"red":""} ${cls||""}" data-id="${cid(c)}"><span class="cr">${rs(c.r)}</span><span class="cs">${SYM[c.s]}</span><span class="cb">${SYM[c.s]}</span></div>`; }
function render(){
  if (!G) return;
  $("title").textContent="Hearts · "+LEVELS[G.level];
  for (let p=0;p<4;p++){
    const el=$("seat"+p), n=G.hands[p].length;
    const backs = `<div class="backs">${Array.from({length:Math.min(n,13)},()=>`<div class="back" style="background:${backBg(p)}"></div>`).join("")}</div>`;
    const lead = (G.phase==="play" && G.tricks===0 && !G.trick.length && G.turn===p) ? "" : "";
    el.className="seat"+(G.phase==="play"&&G.turn===p&&G.trick.length<4?" turn":"");
    const av = p===0 ? "" : (G.names?`<img class="av" src="${CATS[G.names[p]]}" alt="">`:"");
    const lvTag = (p>0 && G.level===4) ? `<span class="tag">${LEVELS[lvOf(p)]}</span>` : "";
    el.innerHTML=`${av}<div class="nm">${nm(p)}</div>${lvTag}${p===0?"":backs}
      <div class="sc"><b>${G.scores[p]}</b>${G.handPts[p]?` <span class="tag">+${G.handPts[p]} this hand</span>`:""}</div>${lead}`;
  }
  // trick
  const TR=$("trick"), have=[...TR.children].filter(x=>x.classList.contains("card")).map(x=>x.dataset.id), want=G.trick.map(t=>cid(t.c));
  if (want.length && have.length<=want.length && have.every((id,i)=>id===want[i])){
    for (let i=have.length;i<want.length;i++){ const t=G.trick[i]; TR.insertAdjacentHTML("beforeend",cardHTML(t.c,"p"+t.p)); }
  } else TR.innerHTML=G.trick.map(t=>cardHTML(t.c,"p"+t.p)).join("") || (G.phase==="pass"?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.85;text-align:center">Pass ${PASSNAME[G.dir]}<br>${G.dir===0?"⬅️":G.dir===1?"➡️":"⬆️"}</div>`:"");
  // hand
  const h=G.hands[0], H=$("hand"), W=H.clientWidth;
  const myTurn = G.phase==="play" && G.turn===0 && !busy && G.trick.length<4;
  const L=myTurn?new Set(legal(0).map(cid)):null;
  const tmp=document.createElement("div"); tmp.innerHTML=cardHTML({s:"C",r:2}); document.body.appendChild(tmp.firstChild); const cw=document.body.lastChild.offsetWidth; document.body.lastChild.remove();
  const n=h.length, stepX=n>1?Math.min(cw+4,(W-cw)/(n-1)):0, start=(W-(cw+stepX*(n-1)))/2;
  H.innerHTML=h.map((c,i)=>{
    let cls=sel.has(cid(c))?"sel":"";
    if (myTurn && !L.has(cid(c))) cls+=" dim";
    if (G.received.includes(cid(c))) cls+= Date.now()<flashUntil ? " got" : " new";
    return cardHTML(c,cls).replace('class="card','style="left:'+(start+i*stepX)+'px;z-index:'+i+'" class="card');
  }).join("");
  // actions
  const A=$("actions");
  if (G.phase==="pass") A.innerHTML=`<button class="btn primary" id="passGo" ${sel.size===3?"":"disabled"}>Pass ${sel.size}/3 ${PASSNAME[G.dir]}</button>`;
  else if (G.phase==="handEnd") A.innerHTML=`<button class="btn primary" id="nextGo">Next hand</button>`;
  else if (G.phase==="over") A.innerHTML=`<button class="btn primary" id="againGo">New game</button>`;
  else A.innerHTML=G.lastTrick?`<button class="btn" id="lastGo">Last trick</button>`:"";
  if ($("passGo")) $("passGo").onclick=doPass;
  if ($("nextGo")) $("nextGo").onclick=nextHand;
  if ($("againGo")) $("againGo").onclick=()=>{ writeLocal(SAVE_KEY,null); showStart(); };

function markWinner(w){ const el=[...$("trick").children].find(x=>x.classList.contains("p"+w)); if (el) el.classList.add("win"); }
$("hand").addEventListener("click",e=>{
  const el=e.target.closest(".card"); if (!el || !G) return;
  const id=el.dataset.id;
  if (G.phase==="pass"){
    if (sel.has(id)) sel.delete(id); else if (sel.size<3) sel.add(id);
    render(); return;
  }
  if (G.phase!=="play" || G.trick.length===4) return;
  if (G.turn!==0){ setMsg(`Hang on, it's ${nm(G.turn)}'s turn.`); return; }
  if (busy) return;
  const c=G.hands[0].find(x=>cid(x)===id);
  if (!legal(0).some(x=>cid(x)===id)){
    const T=G.trick;
    if (!T.length && G.tricks===0) setMsg("The 2♣ leads the first trick.");
    else if (T.length && G.hands[0].some(x=>x.s===T[0].c.s)) setMsg(`You have to follow suit (${SYM[T[0].c.s]}).`);
    else if (!T.length) setMsg("Hearts haven't been broken yet.");
    else setMsg("No points on the first trick.");
    return;
  }
  if (sel.has(id)) playCard(0,c);
  else { sel.clear(); sel.add(id); render(); setMsg((G.note?G.note+"<br>":"")+"Tap again to play."); }
});

function resume(saved){

function blankStats(){ return {records:{},games:0,streak:0,bestStreak:0,best:null,moons:0}; }
function loadStats(){ return Object.assign(blankStats(), readLocal(STATS_KEY)||{}); }
function saveStats(s){ writeLocal(STATS_KEY,s); }
function bumpStat(k){ const s=loadStats(); s[k]=(s[k]||0)+1; saveStats(s); }
function recordResult(moonedLastHand){
  const st=loadStats(), me=G.scores[0], others=G.scores.slice(1), low=Math.min(...others);
  const res= me<low ? "w" : me===low ? "t" : "l";
  const key=`${G.level}|${G.target}`; const r=st.records[key]||(st.records[key]={w:0,l:0,t:0}); r[res]++;
  st.games++;
  if (res==="w"){ st.streak++; st.bestStreak=Math.max(st.bestStreak,st.streak); if (st.best==null||me<st.best) st.best=me; } else if (res==="l") st.streak=0;
  if (moonedLastHand) st.moons=(st.moons||0)+1;
  saveStats(st);
  let w=0,l=0; for (const k in st.records){ w+=st.records[k].w; l+=st.records[k].l; }
  return {res, line: res==="w" ? `Win streak: ${st.streak}` : `Record: ${w}–${l}`};
}
function showStats(){
  const st=loadStats(); let w=0,l=0,t=0;
  for (const k in st.records){ w+=st.records[k].w; l+=st.records[k].l; t+=st.records[k].t; }
  const rows=[]; for (let lv=0;lv<5;lv++) for (const tg of [50,75,100]){ const r=st.records[`${lv}|${tg}`]; if (r) rows.push(`<tr><td>${LEVELS[lv]} · to ${tg}</td><td>${r.w}–${r.l}${r.t?"–"+r.t:""}</td></tr>`); }
  dialog(`<h2>Hearts stats</h2><table class="res">
      <tr><td>Record (W–L${t?"–T":""})</td><td>${w}–${l}${t?"–"+t:""}</td></tr>
      <tr><td>Win rate</td><td>${st.games?Math.round(100*w/st.games)+"%":"–"}</td></tr>
      <tr><td>Current win streak</td><td>${st.streak}</td></tr>
      <tr><td>Best win streak</td><td>${st.bestStreak}</td></tr>
      <tr><td>Best winning score (lowest)</td><td>${st.best??"–"}</td></tr>
      <tr><td>Moons shot 🌙</td><td>${st.moons||0}</td></tr></table>
    ${rows.length?`<div class="lbl">By difficulty</div><table class="res">${rows.join("")}</table>`:`<p>Finish a game to start your record.</p>`}
    <div class="stack"><button class="btn primary" id="stClose">Close</button><button class="btn" id="stExp">Export stats (backup)</button><button class="btn" id="stImp">Import stats</button><button class="btn" id="stReset">Reset stats</button></div>`);
  $("stClose").onclick=()=>{ statsBack?statsBack():closeDialog(); };
  $("stExp").onclick=()=>{
    const code="HR1:"+btoa(unescape(encodeURIComponent(JSON.stringify(st))));
    dialog(`<h2>Export stats</h2><p>Copy this code somewhere safe. Paste it into Import to restore.</p><textarea id="eC" readonly>${code}</textarea><p id="eM"></p>
      <div class="stack"><button class="btn primary" id="eCp">Copy code</button><button class="btn" id="eB">Back</button></div>`);
    $("eCp").onclick=()=>{ const ta=$("eC"); ta.focus(); ta.select(); const ok=()=>$("eM").textContent="Copied ✓", bad=()=>$("eM").textContent="Long-press the selected code and choose Copy.";
      try{ navigator.clipboard.writeText(code).then(ok,()=>{ try{ document.execCommand("copy")?ok():bad(); }catch(e){bad();} }); }catch(e){ bad(); } };
    $("eB").onclick=showStats;
  };
  $("stImp").onclick=()=>{
    dialog(`<h2>Import stats</h2><p>Paste a Hearts code from Export. This replaces your current Hearts stats.</p><textarea id="iC"></textarea><p id="iM"></p>
      <div class="stack"><button class="btn primary" id="iGo">Import</button><button class="btn" id="iB">Back</button></div>`);
    $("iGo").onclick=()=>{ try{ const raw=$("iC").value.trim(); if(!raw.startsWith("HR1:")) throw 0; const o=JSON.parse(decodeURIComponent(escape(atob(raw.slice(4))))); if(!o||typeof o.records!=="object") throw 0; saveStats(Object.assign(blankStats(),o)); showStats(); }catch(e){ $("iM").textContent="That code doesn't look right."; } };
    $("iB").onclick=showStats;
  };
  $("stReset").onclick=()=>{
    dialog(`<h2>Reset Hearts stats?</h2><p>This can't be undone.</p><div class="stack"><button class="btn primary" id="rsY">Reset</button><button class="btn" id="rsN">Cancel</button></div>`);
    $("rsY").onclick=()=>{ saveStats(blankStats()); showStats(); }; $("rsN").onclick=showStats;
  };
}

// ---------- Boot ----------
if ("serviceWorker" in navigator) window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
(function(){
  const saved=readLocal(SAVE_KEY);
  if (saved && !saved.over && saved.hands) resume(saved); else showStart();
})();
</script>
