<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glorg's Games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1916">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Word Rack</title>
<style>
  :root{
    --bg:#f4efe6; --ink:#2b2621; --muted:#7a6f63; --board:#e9dfcc; --line:#d6c9b1;
    --tile:#f7e2b0; --tileEdge:#c9a865; --tw:#c8513b; --dw:#e7a39a; --tl:#3f7fae; --dl:#a9cbe2;
    --pend:#ffe27a; --last:#cfe7b9; --accent:#2f6f5e; --panel:#fff8ec; --tileInk:#2b2621; --dwInk:#7c2c22; --dlInk:#285573;
  }
  :root[data-theme=dark]{
    --bg:#1b1916; --ink:#efe7da; --muted:#a39886; --board:#2b2824; --line:#3e3933; --panel:#26231f;
    --tile:#ead39f; --tileEdge:#b38f4c; --tw:#a5402e; --dw:#8a4740; --tl:#2d6191; --dl:#2c4d65;
    --pend:#f5d562; --last:#bfdca6; --accent:#3d8a75; --dwInk:#f6d3cd; --dlInk:#bcd8ec;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #app{max-width:540px;margin:0 auto;padding:calc(6px + env(safe-area-inset-top)) calc(4px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left))}
  header{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
  .pl{flex:1;min-width:70px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:12px;color:var(--muted)}
  .pl b{display:block;font-size:20px;color:var(--ink)}
  .pl.turn{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  .bagbox{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:11px;color:var(--muted);padding:0 6px}
  .bagbox b{font-size:17px;color:var(--ink)}
  #menuBtn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:20px;padding:0 10px;color:var(--ink)}
  .pav{width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:-5px;margin-right:4px}
  #dm{position:absolute;left:8px;right:8px;top:8px;z-index:3;display:flex;align-items:center;gap:8px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:7px 10px;box-shadow:0 4px 14px rgba(0,0,0,.22);font-size:14px;pointer-events:none;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s}
  #dm.show{opacity:1;transform:none}
  #dm img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:0 0 auto}
  #msg{min-height:36px;margin:6px 2px;font-size:14px;line-height:1.3;display:flex;align-items:center}
  #msg.err{color:#b23a26}
  #boardArea{position:relative}
  #boardWrap{width:100%;aspect-ratio:1;overflow:auto;border-radius:6px;touch-action:pan-x pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #zoomBtn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:18px;padding:0 9px;color:var(--ink)}
  html,body{touch-action:pan-x pan-y}
  #board{width:calc(100% * var(--z,1));container-type:inline-size;display:grid;grid-template-columns:repeat(15,minmax(0,1fr));grid-template-rows:repeat(15,minmax(0,1fr));gap:1px;background:var(--line);border:2px solid var(--line);border-radius:6px;aspect-ratio:1;user-select:none}
  .cell{position:relative;min-width:0;min-height:0;background:var(--board);display:flex;align-items:center;justify-content:center;font-size:2.15cqw;font-weight:700;color:rgba(255,255,255,.95);overflow:hidden}
  .TW{background:var(--tw)} .DW{background:var(--dw)} .TL{background:var(--tl)} .DL{background:var(--dl);color:var(--dlInk)}
  .DW{color:var(--dwInk)}
  .star::after{content:"★";font-size:4.4cqw;color:var(--dwInk)}
  .t{position:absolute;inset:1px;background:var(--tile);border-radius:3px;box-shadow:inset 0 -2px 0 var(--tileEdge);display:flex;align-items:center;justify-content:center;color:var(--tileInk);font-size:4.3cqw;font-weight:700}
  .t i{position:absolute;right:2px;bottom:1px;font-style:normal;font-size:2cqw;font-weight:600}
  .t.blank{color:#9a5b16}
  .t.pend{background:var(--pend);touch-action:none;cursor:grab}
  .t.last{background:var(--last)}
  #rack{display:flex;justify-content:center;gap:5px;margin:12px 0 10px;min-height:min(13vw,60px)}
  .rt{width:min(12.5vw,58px);height:min(12.5vw,58px);background:var(--tile);border-radius:7px;box-shadow:inset 0 -3px 0 var(--tileEdge),0 1px 2px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:min(7vw,30px);font-weight:700;position:relative;border:2px solid transparent;color:var(--tileInk);touch-action:none;cursor:grab}
  .rt.dragging,.t.dragging{opacity:.3}
  #rack,#board,.rt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .cell.hover{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
  #rack.hover{background:rgba(127,127,127,.12);border-radius:10px}
  #ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;width:min(12.5vw,58px);height:min(12.5vw,58px);background:var(--pend);border-radius:7px;box-shadow:inset 0 -3px 0 var(--tileEdge),0 6px 16px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:min(7vw,30px);font-weight:700;color:var(--tileInk)}
  .rt i{position:absolute;right:4px;bottom:2px;font-style:normal;font-size:min(3vw,13px)}
  .rt.sel{border-color:var(--accent);transform:translateY(-4px)}
  .rt.pick{background:#c9e6da}
  #controls{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  #controls .btn{grid-column:span 2} #controls .btn.wide{grid-column:span 6} #controls .btn.half{grid-column:span 3} #controls .half{grid-column:span 3}
  button{font:inherit}
  .btn{padding:11px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:15px;font-weight:600;color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.45}
  #controls .wide{grid-column:span 6}
  details{margin-top:12px;font-size:13px}
  summary{color:var(--muted);padding:4px 2px}
  #log{margin:4px 0 0;padding-left:22px;max-height:220px;overflow:auto;color:var(--ink)}
  #log li{margin:2px 0}
  .overlay{position:fixed;inset:0;background:rgba(43,38,33,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .hidden{display:none}
  .card{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
  .card h1{margin:0 0 4px;font-size:26px}
  .brand{display:flex;align-items:center;gap:12px}
  .cat{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--tile),0 2px 8px rgba(0,0,0,.25);flex:0 0 auto}
  .cat.big{width:120px;height:120px;display:block;margin:4px auto 10px}
  .card h2{margin:0 0 10px;font-size:19px}
  .card p{margin:6px 0;color:var(--muted);font-size:14px;line-height:1.4}
  .lbl{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  .seg{display:grid;gap:6px}
  .seg button{padding:10px 4px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:600;color:var(--ink)}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stack{display:grid;gap:8px;margin-top:16px}
  .letters{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
  .letters button{padding:10px 0;border-radius:8px;border:1px solid var(--tileEdge);background:var(--tile);font-weight:700;font-size:18px;color:var(--tileInk)}
  .res{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
  .res td{padding:6px 4px;border-bottom:1px solid var(--line)}
  .res td:last-child{text-align:right;font-weight:700}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:16px;color:var(--muted);z-index:20}
</style>
</head>
<body>
<div id="loading">Loading…</div>
<div id="app">
  <header id="scores"></header>
  <div id="msg"></div>
  <div id="boardArea"><div id="dm"></div><div id="boardWrap"><div id="board"></div></div></div>
  <div id="rack"></div>
  <div id="controls">
    <button class="btn primary wide" id="playBtn">Play</button>
    <button class="btn" id="recallBtn">Recall</button>
    <button class="btn" id="shuffleBtn">Shuffle</button>
    <button class="btn" id="swapBtn">Swap</button>
    <button class="btn" id="hintBtn">💡 Hint</button>
    <button class="btn" id="passBtn">Pass</button>
    <button class="btn" id="lookBtn">Check word</button>
  </div>
  <details><summary>Move log</summary><ol id="log"></ol></details>
</div>
<div id="dialog" class="overlay hidden"><div class="card" id="dlgCard"></div></div>

<script src="cats.js"></script>

// ---------- Dictionary ----------
// ENABLE is a public-domain Scrabble word list. Loaded from your site if you add enable1.txt, otherwise from GitHub,
// then kept on the phone for offline play. If neither can be reached, the built-in list is used.
const ENABLE_URL="https://raw.githubusercontent.com/dolph/dictionary/master/enable1.txt";
const GAME_EXTRAS="AA AB AD AE AG AH AI AL AM AN AR AS AT AW AX AY BA BE BI BO BY DA DE DO ED EF EH EL EM EN ER ES EW EX FA FE GI GO HA HE HI HM HO ID IF IN IS IT JO KA KI LA LI LO MA ME MI MM MO MU MY NA NE NO NU OD OE OF OH OI OK OM ON OP OR OS OW OX OY PA PE PI PO QI RE SH SI SO TA TE TI TO UH UM UN UP US UT WE WO XI XU YA YE YO ZA QIS ZAS KIS OKA OKE EMOJI EMOJIS QAT QATS QAID QAIDS QOPH QOPHS FAQIR FAQIRS QANAT QANATS TRANQ TRANQS QINDAR QINTAR SHEQEL SUQ SUQS".split(" ");
let DICT_NAME="built-in";
async function fetchText(url,ms){
  const ctl=typeof AbortController!=="undefined"?new AbortController():null;
  const t=setTimeout(()=>ctl&&ctl.abort(),ms);
  try{ const r=await fetch(url,ctl?{signal:ctl.signal}:{}); clearTimeout(t); return r.ok?await r.text():null; }catch(e){ clearTimeout(t); return null; }
}
async function loadDict(){
  let arr=null;
  for (const [url,ms] of [["enable1.txt",6000],[ENABLE_URL,12000]]){
    const txt=await fetchText(url,ms); if (!txt) continue;
    const a=txt.split(/\r?\n/).map(w=>w.trim().toUpperCase()).filter(w=>/^[A-Z]{2,15}$/.test(w));
    if (a.length>150000){ arr=a.concat(GAME_EXTRAS); DICT_NAME="ENABLE Scrabble list"; break; }
  }
  if (!arr){
    const txt=await fetchText("words.txt",15000)||"";
    arr=txt.split("\n").map(w=>w.trim()).filter(Boolean);
  }
  WORDS = new Set(arr);
  TRIE = {};
  for (const w of arr){
    let n = TRIE;
    for (let i=0;i<w.length;i++){ const ch=w[i]; n = n[ch] || (n[ch]={}); }
    n.$ = 1;
  }
}

// ---------- Persistence ----------
// Saves go to your claude.ai account (private to you) when available, and to this browser as a backup.
let cloud=null, SAVED=null;
const writers={};
function cloudWrite(name, body){
  if (!cloud) return;
  const w=writers[name]||(writers[name]={busy:false,next:null});
  w.next=body; if (w.busy) return;
  w.busy=true;
  (async()=>{
    while (w.next){ const b=w.next; w.next=null;
      try{ await cloud.ref(name).set(b); }
      catch(e){ if (e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ await cloud.ref(name).set(b);}catch(_){} } }
    }
    w.busy=false;
  })();
}
function readLocal(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function writeLocal(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function save(){
  S.savedAt=Date.now(); SAVED=S;
  writeLocal(SAVE_KEY,S);
  cloudWrite("game",{state:JSON.stringify(S),savedAt:S.savedAt});
}
function loadSaved(){ return SAVED; }
function clearSaved(){
  SAVED=null; writeLocal(SAVE_KEY,null);
  cloudWrite("game",{state:null,savedAt:Date.now()});
}
async function initStorage(){
  let local=readLocal(SAVE_KEY), localStats=readLocal(STATS_KEY);
  let cGame=null, cStats=null;
  try{
    const timeout=new Promise(r=>setTimeout(()=>r(null),8000));
    const got=await Promise.race([(async()=>{
      if (!window.claude) return null;
      const db=await claude.use("db"), user=await claude.use("user");
      if (!db || !user) return null;
      const uid=await user.id(); if (!uid) return null;
      const base="data/users/"+uid+"/";
      const refs={game:db.doc(base+"game"),stats:db.doc(base+"stats")};
      const [g,st]=await Promise.all([refs.game.get(),refs.stats.get()]);
      return {refs,g,st};
    })(), timeout]);
    if (got){
      cloud={ref:n=>got.refs[n]};
      if (got.g.exists){ const d=got.g.data(); cGame={savedAt:d.savedAt||0,state:d.state?JSON.parse(d.state):null}; }
      if (got.st.exists){ const d=got.st.data(); try{ cStats=JSON.parse(d.stats); }catch(e){} }
    }
  }catch(e){ cloud=null; }
  // Newest wins.
  if (cGame && (!local || (cGame.savedAt||0)>=(local.savedAt||0))) SAVED=cGame.state; else SAVED=local;
  STATS=Object.assign(blankStats(), pickNewer(cStats,localStats)||{});
  if (cloud){ // make sure the cloud copy is up to date
    if (SAVED && (!cGame || (SAVED.savedAt||0)>(cGame.savedAt||0))) cloudWrite("game",{state:JSON.stringify(SAVED),savedAt:SAVED.savedAt||Date.now()});
    if (!cStats || (STATS.savedAt||0)>(cStats.savedAt||0)) cloudWrite("stats",{stats:JSON.stringify(STATS),savedAt:STATS.savedAt||Date.now()});
  }
}
function pickNewer(a,b){ if (!a) return b; if (!b) return a; return (a.savedAt||0)>=(b.savedAt||0)?a:b; }

// ---------- Game setup ----------
function newGame(numCpu, level){
  const bag=[]; for (const l in DIST) for (let i=0;i<DIST[l];i++) bag.push(l);
  shuffle(bag);
  const players=[{name:"You",human:true,rack:[],score:0}];
  const cats=GameCats.pickCats(numCpu);
  for (let i=0;i<numCpu;i++) players.push({name:cats[i], cat:cats[i], human:false, rack:[], score:0});
  S = {board:new Array(N*N).fill(null), players, bag, turn:0, scoreless:0, over:false, log:[], last:[], level, firstMove:true, hintsLeft:HINTS_FOR[level]};
  for (const p of players) draw(p);
  pending=[]; selected=-1;
  save(); render(); setMsg("Your turn. Tap a tile, then tap a square."); setTimeout(checkStuck,400);
}
const isVowel=l=>"AEIOU?".includes(l);
function draw(p){
  // Refill the rack, but never leave a rack with no vowels or no consonants while the bag can fix it.
  const start=p.rack.length;
  for (let attempt=0; attempt<8; attempt++){
    while (p.rack.length<7 && S.bag.length) p.rack.push(S.bag.pop());
    const v=p.rack.filter(isVowel).length;
    const balanced = v>0 && v<p.rack.length;
    if (balanced || p.rack.length<7 || S.bag.length<7 || p.rack.length===start) return;
    S.bag.push(...p.rack.splice(start)); shuffle(S.bag);
  }
}
const rackSum = r => r.reduce((s,l)=>s+VAL[l],0);

// ---------- Move evaluation (used for the player) ----------
function evaluate(board, pend){
  if (!pend.length) return {err:"Place some tiles first."};
  const rows=pend.map(p=>Math.floor(p.idx/N)), cols=pend.map(p=>p.idx%N);
  const sameRow=rows.every(r=>r===rows[0]), sameCol=cols.every(c=>c===cols[0]);
  if (!sameRow && !sameCol) return {err:"Tiles must be in a single row or column."};
  const tmp=board.slice(); for (const p of pend) tmp[p.idx]={l:p.l,b:p.b};
  const at=(r,c)=>(r<0||c<0||r>=N||c>=N)?null:tmp[r*N+c];
  const r0=rows[0], c0=cols[0];
  let horiz = pend.length>1 ? sameRow : !!(at(r0,c0-1)||at(r0,c0+1));
  const line = horiz?cols:rows, mn=Math.min(...line), mx=Math.max(...line);
  for (let k=mn;k<=mx;k++) if (!(horiz?at(r0,k):at(k,c0))) return {err:"Tiles must be connected with no gaps."};
  const empty = board.every(x=>!x);
  if (empty){
    if (!pend.some(p=>p.idx===CENTER)) return {err:"The first word must cover the center ★."};
    if (pend.length<2) return {err:"The first word needs at least 2 letters."};
  } else {
    const ob=(r,c)=>(r<0||c<0||r>=N||c>=N)?null:board[r*N+c];
    const touches=pend.some(p=>{const r=Math.floor(p.idx/N),c=p.idx%N;return ob(r-1,c)||ob(r+1,c)||ob(r,c-1)||ob(r,c+1);});
    if (!touches) return {err:"Your word must connect to tiles already on the board."};
  }
  const pset=new Set(pend.map(p=>p.idx));
  function wordAt(r,c,h){
    const dr=h?0:1, dc=h?1:0;
    while (at(r-dr,c-dc)){ r-=dr; c-=dc; }
    let w="",sum=0,mult=1,len=0;
    while (at(r,c)){
      const t=at(r,c), idx=r*N+c; let v=t.b?0:VAL[t.l];
      if (pset.has(idx)){ const pm=PREM[idx]; if(pm==="DL")v*=2; else if(pm==="TL")v*=3; else if(pm==="DW")mult*=2; else if(pm==="TW")mult*=3; }
      sum+=v; w+=t.l; r+=dr; c+=dc; len++;
    }
    return len<2?null:{word:w,score:sum*mult};
  }
  const words=[]; const main=wordAt(r0,c0,horiz); if(main) words.push(main);
  for (const p of pend){ const cw=wordAt(Math.floor(p.idx/N),p.idx%N,!horiz); if(cw) words.push(cw); }
  if (!words.length) return {err:"Words need at least 2 letters."};
  let score=words.reduce((s,w)=>s+w.score,0); if (pend.length===7) score+=50;
  const bad=words.filter(w=>!WORDS.has(w.word)).map(w=>w.word);
  return {words,score,bad,bingo:pend.length===7};
}

// ---------- Move generator (CPU + hints) ----------
function genMoves(board, rack){
  const moves=[], seen=new Set();
  const empty=board.every(x=>!x);
  const counts={}; for (const l of rack) counts[l]=(counts[l]||0)+1;
  for (const horiz of [true,false]){
    if (empty && !horiz) continue;
    const at=(r,c)=>horiz?board[r*N+c]:board[c*N+r];
    const idxOf=(r,c)=>horiz?r*N+c:c*N+r;
    for (let r=0;r<N;r++){
      const cross=new Array(N).fill(null), crossSum=new Array(N).fill(0), anchor=new Array(N).fill(false);
      for (let c=0;c<N;c++){
        if (at(r,c)) continue;
        let up="",dn="",s=0,k=r-1;
        while (k>=0&&at(k,c)){const t=at(k,c);up=t.l+up;s+=t.b?0:VAL[t.l];k--;}
        k=r+1; while (k<N&&at(k,c)){const t=at(k,c);dn+=t.l;s+=t.b?0:VAL[t.l];k++;}
        if (up||dn){
          const ok=new Set(); for (const L of ALPHA) if (WORDS.has(up+L+dn)) ok.add(L);
          cross[c]=ok; crossSum[c]=s; anchor[c]=true;
        }
        if ((c>0&&at(r,c-1))||(c<N-1&&at(r,c+1))) anchor[c]=true;
      }
      if (empty && r===7) anchor[7]=true;
      const placed=new Array(N).fill(null);
      let a=0, left=[], prefixStart=-1, nPlaced=0;

      const record=(end)=>{
        const start = prefixStart>=0 ? prefixStart : a-left.length;
        let sum=0,mult=1,crossTot=0,word="";const tiles=[];
        for (let c=start;c<end;c++){
          let t=null;
          if (c<a && prefixStart<0) t=left[c-start];
          else if (placed[c]) t=placed[c];
          if (t){
            const idx=idxOf(r,c), pm=PREM[idx]; let v=t.b?0:VAL[t.l], lm=1, wm=1;
            if(pm==="DL")lm=2;else if(pm==="TL")lm=3;else if(pm==="DW")wm=2;else if(pm==="TW")wm=3;
            sum+=v*lm; mult*=wm; if (cross[c]) crossTot+=(crossSum[c]+v*lm)*wm;
            tiles.push({idx,l:t.l,b:t.b}); word+=t.l;
          } else { const e=at(r,c); sum+=e.b?0:VAL[e.l]; word+=e.l; }
        }
        const key=tiles.map(t=>t.idx+t.l+(t.b?"*":"")).sort().join(",");
        if (seen.has(key)) return; seen.add(key);
        moves.push({tiles,word,score:sum*mult+crossTot+(tiles.length===7?50:0)});
      };
      const extend=(c,node)=>{
        if (c<N && !at(r,c)){
          if (node.$ && c>a) record(c);
          const cs=cross[c];
          for (const ch in node){
            if (ch==="$") continue;
            if (cs && !cs.has(ch)) continue;
            if (counts[ch]>0){ counts[ch]--; placed[c]={l:ch,b:false}; nPlaced++; extend(c+1,node[ch]); nPlaced--; placed[c]=null; counts[ch]++; }
            if (counts["?"]>0){ counts["?"]--; placed[c]={l:ch,b:true}; nPlaced++; extend(c+1,node[ch]); nPlaced--; placed[c]=null; counts["?"]++; }
          }
        } else if (c<N){
          const nx=node[at(r,c).l]; if (nx) extend(c+1,nx);
        } else if (node.$ && c>a) record(c);
      };
      const leftPart=(node,limit)=>{
        extend(a,node);
        if (limit<=0) return;
        for (const ch in node){
          if (ch==="$") continue;
          if (counts[ch]>0){ counts[ch]--; left.push({l:ch,b:false}); leftPart(node[ch],limit-1); left.pop(); counts[ch]++; }
          if (counts["?"]>0){ counts["?"]--; left.push({l:ch,b:true}); leftPart(node[ch],limit-1); left.pop(); counts["?"]++; }
        }
      };
      for (a=0;a<N;a++){
        if (!anchor[a]) continue;
        left=[];
        if (a>0 && at(r,a-1)){
          let k=a-1,pre=""; while (k>=0&&at(r,k)){pre=at(r,k).l+pre;k--;}
          let node=TRIE; for (const ch of pre){ node=node&&node[ch]; }
          if (node){ prefixStart=k+1; extend(a,node); }
          prefixStart=-1;
        } else {
          let k=a-1,lim=0; while (k>=0&&!at(r,k)&&!anchor[k]){lim++;k--;}
          prefixStart=-1; leftPart(TRIE,Math.min(lim,6));
        }
      }
    }
  }
  return moves;
}

// ---------- CPU strategy ----------
const LEAVE={"?":24,S:8,Z:3,X:3,E:3,R:1.5,H:1,A:1,N:1,T:1,L:.5,D:.5,C:.5,M:.5,I:-1,O:-1,P:-.5,K:-.5,Y:-.5,B:-2,F:-2,G:-2,J:-2,U:-3,W:-4,V:-5,Q:-7};
function remaining(rack,tiles){ const r=rack.slice(); for (const t of tiles){ const i=r.indexOf(t.b?"?":t.l); if(i>=0) r.splice(i,1);} return r; }
function leaveValue(rem){
  let v=0,vow=0,cnt={};
  for (const l of rem){ v+=LEAVE[l]||0; cnt[l]=(cnt[l]||0)+1; if ("AEIOU".includes(l)) vow++; }
  for (const l in cnt) if (cnt[l]>1) v-=(cnt[l]-1)*4;
  const cons=rem.length-vow-(cnt["?"]||0);
  if (rem.length) v-=Math.abs(vow-cons*0.7)*1.5;
  if (cnt.Q && !cnt.U) v-=5;
  return v;
}
function chooseMove(moves, rack, level){
  if (!moves.length) return null;
  moves.sort((x,y)=>y.score-x.score);
  const best=moves[0].score;
  if (level===0){
    let pool=moves.filter(m=>m.tiles.length<=4 && m.score>=best*0.12 && m.score<=Math.max(9,best*0.38));
    if (!pool.length) pool=moves.slice(Math.floor(moves.length/2));
    return pool[rnd(pool.length)];
  }
  if (level===1){
    let pool=moves.filter(m=>m.tiles.length<=5 && m.score>=best*0.3 && m.score<=best*0.6);
    if (!pool.length) pool=moves.filter(m=>m.score<=best*0.7);
    if (!pool.length) pool=moves;
    return pool[rnd(pool.length)];
  }
  if (level===2) return moves[rnd(Math.min(2,moves.length))];
  // Expert: score + rack leave
  if (!S.bag.length) return moves[0];
  let top=null,topV=-1e9;
  for (const m of moves.slice(0,400)){ const v=m.score+leaveValue(remaining(rack,m.tiles)); if (v>topV){topV=v;top=m;} }
  if (topV<8 && S.bag.length>=7) return {exchange:true};
  return top;
}

// ---------- Cat table talk ----------
let dmTimer=null;
const TALK_KEY="cats-talk";
const talkOn=()=>{ try{ return localStorage.getItem(TALK_KEY)!=="off"; }catch(e){ return true; } };
function setTalk(on){ try{ localStorage.setItem(TALK_KEY,on?"on":"off"); }catch(e){} if (!on) $("dm").classList.remove("show"); }
let dmUntil=0;   // the next CPU waits until the current message has been readable for a while
function dm(cat, kind, chance){
  if (!cat || !talkOn() || (chance!=null && Math.random()>chance)) return;
  if (Date.now()<dmUntil-2500 && kind!=="cpuBingo" && kind!=="youBingo") return;   // don't talk over each other
  const line=GameCats.line(kind,cat), el=$("dm");
  el.innerHTML=`<img src="${GameCats.img(cat)}" alt=""><div><b>${cat}:</b> ${line}</div>`;
  const readMs=Math.max(3800, 2200+line.length*55);
  el.classList.add("show"); clearTimeout(dmTimer); dmTimer=setTimeout(()=>el.classList.remove("show"),readMs+2500);
  dmUntil=Date.now()+readMs;
}
const cpuCats=()=>S.players.filter(p=>!p.human&&p.cat);
const anyCat=()=>{ const c=cpuCats(); return c.length?c[rnd(c.length)].cat:null; };

// ---------- No-moves check ----------
function checkStuck(){
  if (!myTurn() || pending.length) return;
  const me=S.players[0];
  if (genMoves(S.board,me.rack).length) return;
  const canFree = S.bag.length>=7 && (S.freeSwapAt??-1)!==(S.turnNo||0);
  dialog(`<h2>No plays available</h2><p>There's nowhere your tiles can make a valid word right now.</p>
    ${canFree?`<p>You can swap all your tiles for free (you keep your turn), or pass so the board can open up.</p>`:`<p>${S.bag.length<7?"The bag is too low to swap, so you'll need to pass.":"You've used your free swap this turn, so you'll need to pass."}</p>`}
    <div class="stack">${canFree?`<button class="btn primary" id="stSwap">Swap all tiles (free)</button>`:""}
    <button class="btn ${canFree?"":"primary"}" id="stPass">Pass</button><button class="btn" id="stLook">Look at the board</button></div>`);
  if ($("stSwap")) $("stSwap").onclick=()=>{
    closeDialog(); const old=me.rack.slice(); me.rack=[]; draw(me); S.bag.push(...old); shuffle(S.bag);
    S.freeSwapAt=S.turnNo||0; S.log.push("You swapped all tiles (no plays available)");
    save(); render(); setMsg("Fresh tiles! Your turn."); setTimeout(checkStuck,60);
  };
  $("stPass").onclick=()=>{ closeDialog(); doPass(true); };
  $("stLook").onclick=closeDialog;
}
function doPass(stuck){
  const me=S.players[0]; recall();
  if (stuck===undefined) stuck=!genMoves(S.board,me.rack).length;
  pass(me); if (stuck && S.bag.length<7) S.stuck=(S.stuck||0)+1;
  setMsg("You passed."); dm(anyCat(),"youPass",0.6); afterMove();
}

// ---------- Turn handling ----------
function commit(p, tiles, ev){
  for (const t of tiles) S.board[t.idx]={l:t.l,b:t.b};
  if (!p.human) for (const t of tiles){ const i=p.rack.indexOf(t.b?"?":t.l); if (i>=0) p.rack.splice(i,1); }
  S.last=tiles.map(t=>t.idx);
  p.score+=ev.score; S.stuck=0;
  S.scoreless = ev.score>0 ? 0 : S.scoreless+1;
  S.firstMove=false;
  draw(p);
  const words=ev.words.map(w=>w.word).join(", ");
  S.log.push(`${p.name}: ${words} for ${ev.score}${ev.bingo?" (bingo! +50)":""}`);
}
function exchange(p, letters){
  for (const l of letters){ const i=p.rack.indexOf(l); if (i>=0) p.rack.splice(i,1); }
  draw(p); S.bag.push(...letters); shuffle(S.bag);
  S.scoreless++; S.last=[];
  S.log.push(`${p.name} swapped ${letters.length} tile${letters.length>1?"s":""}`);
}
function pass(p){ S.scoreless++; S.last=[]; S.log.push(`${p.name} passed`); }

function afterMove(){
  const p=S.players[S.turn];
  if (!p.rack.length && !S.bag.length){ endGame(p); return; }
  if ((S.stuck||0) >= S.players.length){ S.log.push("No moves left for anyone"); S.calledMsg="Nobody could make a move, so the game was called."; endGame(null); return; }
  if (S.scoreless >= S.players.length*3){ endGame(null); return; }
  S.turn=(S.turn+1)%S.players.length; S.turnNo=(S.turnNo||0)+1;
  save(); render();
  if (!S.players[S.turn].human) setTimeout(cpuTurn, Math.max(450, dmUntil-Date.now()));
  else setTimeout(checkStuck, 400);
}

function cpuTurn(){
  if (!S || S.over) return;
  const p=S.players[S.turn]; if (p.human) return;
  busy=true; render();
  setMsg(`${p.name} is thinking…`);
  setTimeout(()=>{
    const moves=genMoves(S.board,p.rack);
    let m=chooseMove(moves,p.rack,S.level);
    if (m && !m.exchange){
      const ev=evaluate(S.board,m.tiles);
      commit(p,m.tiles,ev);
      setMsg(`${p.name} played <b>${m.word}</b> for ${ev.score}.`);
      if (ev.bingo) dm(p.cat,"cpuBingo");
      else if (ev.score>=30) dm(p.cat,"cpuBig",0.75);
      else if (p.score-S.players[0].score>60) dm(p.cat,"cpuAhead",0.25);
      else if (S.players[0].score-p.score>60) dm(p.cat,"cpuBehind",0.25);
      else dm(p.cat,"cpuSmall",0.2);
    } else if (S.bag.length>=7){
      const keep=new Set(["?","S","E"]); let out=p.rack.filter(l=>!keep.has(l));
      if (!out.length) out=p.rack.slice(0,3);
      exchange(p,out); setMsg(`${p.name} swapped ${out.length} tiles.`); dm(p.cat,"cpuSwap",0.6);
    } else { pass(p); if (!moves.length) S.stuck=(S.stuck||0)+1; setMsg(`${p.name} passed.`); }
    busy=false;
    afterMove();
  },30);
}

function endGame(outPlayer){
  S.over=true;
  let bonus=0;
  for (const p of S.players){ if (p===outPlayer) continue; const s=rackSum(p.rack); p.score-=s; bonus+=s; }
  if (outPlayer) outPlayer.score+=bonus;
  S.log.push("Game over");
  const r=recordResult(); S.statLine = r.res==="w" ? `Win streak: ${r.st.streak}` : `Record: ${Object.values(r.st.records).reduce((a,x)=>a+x.w,0)}–${Object.values(r.st.records).reduce((a,x)=>a+x.l,0)}`;
  save(); render(); showResults();
}

// ---------- Player actions ----------
function placeAt(idx){
  const me=S.players[0];
  if (selected<0) { setMsg("Tap a tile in your rack first."); return; }
  const l=me.rack[selected];
  const doPlace=(letter,blank)=>{
    me.rack.splice(selected,1); pending.push({idx,l:letter,b:blank,orig:l}); selected=-1;
    render(); previewMsg();
  };
  if (l==="?") pickBlank(letter=>doPlace(letter,true));
  else doPlace(l,false);
}
function unplace(idx){
  const i=pending.findIndex(p=>p.idx===idx); if (i<0) return;
  S.players[0].rack.push(pending[i].orig); pending.splice(i,1); render(); previewMsg();
}
function recall(){ for (const p of pending) S.players[0].rack.push(p.orig); pending=[]; selected=-1; }
function previewMsg(){
  if (!pending.length){ setMsg("Your turn."); return; }
  const ev=evaluate(S.board,pending);
  if (ev.err) setMsg(ev.err);
  else if (ev.bad.length) setMsg(`Not in dictionary: <b>${ev.bad.join(", ")}</b>`, true);
  else setMsg(`${ev.words.map(w=>w.word).join(", ")} — <b>${ev.score} pts</b>${ev.bingo?" (bingo!)":""}`);
}
function play(){
  if (!myTurn()) return;
  const ev=evaluate(S.board,pending);
  if (ev.err){ setMsg(ev.err,true); return; }
  if (ev.bad.length){ setMsg(`Not in dictionary: <b>${ev.bad.join(", ")}</b>`,true); return; }
  const tiles=pending.map(p=>({idx:p.idx,l:p.l,b:p.b}));
  pending=[]; commit(S.players[0],tiles,ev);
  noteBestWord(ev.words[0].word, ev.score);
  setMsg(`You played <b>${ev.words.map(w=>w.word).join(", ")}</b> for ${ev.score}.`);
  if (ev.bingo) dm(anyCat(),"youBingo"); else if (ev.score>=30) dm(anyCat(),"youBig",0.7); else if (ev.score<10) dm(anyCat(),"youSmall",0.35);
  afterMove();
}
const myTurn=()=>S && !S.over && !busy && S.players[S.turn].human;

// ---------- Rendering ----------
function setMsg(h,err){ const m=$("msg"); m.innerHTML="<span>"+h+"</span>"; m.classList.toggle("err",!!err); }
function buildBoard(){
  const b=$("board"); b.innerHTML="";
  for (let i=0;i<N*N;i++){ const d=document.createElement("div"); d.className="cell"; d.dataset.i=i; b.appendChild(d); }
  b.addEventListener("click",e=>{
    if (suppressClick) return;
    const c=e.target.closest(".cell"); if (!c || !myTurn()) return;
    const i=+c.dataset.i;
    if (pending.some(p=>p.idx===i)) unplace(i);
    else if (!S.board[i]) placeAt(i);
  });
}
function tileHTML(t,cls){ return `<div class="t ${t.b?"blank":""} ${cls}">${t.l}${t.b?"":`<i>${VAL[t.l]}</i>`}</div>`; }
function render(){
  if (!S) return;
  // scores
  const h=$("scores");
  h.innerHTML=S.players.map((p,i)=>`<div class="pl ${i===S.turn&&!S.over?"turn":""}">${p.cat?`<img class="pav" src="${GameCats.img(p.cat)}" alt="">`:""}${p.name}${p.human?"":` · ${LEVELS[S.level]}`}<b>${p.score}</b></div>`).join("")
    +`<div class="bagbox">Bag<b>${S.bag.length}</b></div><button id="zoomBtn" aria-label="Zoom board">${zoom>1.05?"−":"🔍"}</button><button id="menuBtn" aria-label="Menu">☰</button>`;
  $("menuBtn").onclick=showMenu; $("zoomBtn").onclick=zoomClick;
  // board
  const cells=$("board").children, pmap=new Map(pending.map(p=>[p.idx,p])), last=new Set(S.last);
  for (let i=0;i<N*N;i++){
    const c=cells[i], t=S.board[i], pp=pmap.get(i), pm=PREM[i];
    c.className="cell "+pm+(i===CENTER&&!t&&!pp?" star":"");
    if (pp) c.innerHTML=tileHTML(pp,"pend");
    else if (t) c.innerHTML=tileHTML(t,last.has(i)?"last":"");
    else c.innerHTML=(pm&&i!==CENTER)?pm:"";
  }
  // rack
  const me=S.players[0];
  $("rack").innerHTML=me.rack.map((l,i)=>`<div class="rt ${i===selected?"sel":""}" data-i="${i}">${l==="?"?"":l}${l==="?"?"":`<i>${VAL[l]}</i>`}</div>`).join("");
  // buttons
  const mt=myTurn();
  for (const id of ["playBtn","recallBtn","swapBtn","passBtn"]) $(id).disabled=!mt;
  $("swapBtn").disabled=!mt||S.bag.length<7;
  if (S.hintsLeft===undefined) S.hintsLeft=HINTS_FOR[S.level];
  const hb=$("hintBtn"); hb.disabled=!mt||S.hintsLeft===0;
  hb.textContent = S.level===3 ? "💡 No hints" : S.hintsLeft<0 ? "💡 Hint" : `💡 Hint (${S.hintsLeft})`;
  const ev=pending.length?evaluate(S.board,pending):null;
  $("playBtn").textContent = ev && !ev.err && !ev.bad.length ? `Play (${ev.score})` : "Play";
  $("log").innerHTML=S.log.map(x=>`<li>${x}</li>`).join("");
}
$("rack").addEventListener("click",e=>{
  if (suppressClick) return;
  const t=e.target.closest(".rt"); if (!t || !S || S.over) return;
  const i=+t.dataset.i; selected = selected===i ? -1 : i; render();
});

      <div class="lbl">Cat smack talk</div>
      <div class="seg" style="grid-template-columns:repeat(2,1fr)"><button data-talk="1" class="${talkOn()?"on":""}">On 😼</button><button data-talk="0" class="${talkOn()?"":"on"}">Off 😶</button></div>
      <div class="stack"><button class="btn ${saved&&!saved.over?"":"primary"}" id="goBtn">New game</button><button class="btn" id="stStats">📊 Stats</button><a class="btn" href="./" style="text-align:center;text-decoration:none;display:block">← All games</a></div>`);
    $("stStats").onclick=()=>{ statsBack=draw_; showStats(); };
    $("dlgCard").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{numCpu=+b.dataset.n;draw_();});
    $("dlgCard").querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{level=+b.dataset.lv;draw_();});
    $("dlgCard").querySelectorAll("[data-talk]").forEach(b=>b.onclick=()=>{setTalk(b.dataset.talk==="1");draw_();});
    $("goBtn").onclick=()=>{closeDialog();newGame(numCpu,level);};
    if ($("contBtn")) $("contBtn").onclick=()=>{closeDialog();resume(saved);};
  };
  draw_();
}
function resume(saved){
  S=saved; pending=[]; selected=-1;
  const cpus=S.players.filter(p=>!p.human&&!p.cat);
  if (cpus.length){ const cats=GameCats.pickCats(cpus.length); cpus.forEach((p,i)=>{ p.cat=cats[i]; p.name=cats[i]; }); }
  render(); setTimeout(checkStuck,400);
  setMsg(S.players[S.turn].human?"Welcome back — your turn.":"");
  if (!S.players[S.turn].human) setTimeout(cpuTurn,300);
}
function showMenu(){
  dialog(`<h2>Menu</h2><div class="stack">
    <button class="btn primary" id="mResume">Back to game</button>
    <button class="btn" id="mNew">New game</button>

    <button class="btn" id="mTheme">${isDark()?"☀️ Light mode":"🌙 Dark mode"}</button>
    <button class="btn" id="mTalk">Cat smack talk: ${talkOn()?"On 😼":"Off 😶"}</button>
    <button class="btn" id="mRules">How to play</button>
    <a class="btn" href="./" style="text-align:center;text-decoration:none;display:block">← All games</a></div>`);
  $("mTheme").onclick=()=>{ setTheme(isDark()?"light":"dark"); showMenu(); };
  $("mResume").onclick=closeDialog;
  $("mTalk").onclick=()=>{ setTalk(!talkOn()); showMenu(); };
  $("mStats").onclick=()=>{ statsBack=null; showStats(); };
  $("mNew").onclick=()=>{
    dialog(`<h2>Start a new game?</h2><p>Your current game will be lost.</p><div class="stack">
      <button class="btn primary" id="yNew">Yes, new game</button><button class="btn" id="nNew">Cancel</button></div>`);
    $("yNew").onclick=()=>{clearSaved();showStart();};

  $("mRules").onclick=()=>{
    dialog(`<h2>How to play</h2>
      <p>Drag a tile from your rack onto the board, or tap a tile then tap a square. Drag placed tiles to move them, or back to your rack. Tap a placed tile to take it back. Drag tiles within your rack to reorder.</p>
      <p>Words go in one row or column and must connect to tiles already on the board. The first word covers the ★.</p>
      <p><b>DL/TL</b> double/triple a letter, <b>DW/TW</b> double/triple the word. Using all 7 tiles earns a 50-point bonus. Blank tiles are worth 0.</p>
      <p>The game ends when the bag is empty and someone uses their last tile. Leftover tiles count against you.</p>
      <p>Your game saves automatically, so you can close the page and pick up later.</p>
      <div class="stack"><button class="btn primary" id="rOk">Got it</button></div>`);
    $("rOk").onclick=closeDialog;
  };
}
function showResults(){
  const ranked=S.players.slice().sort((a,b)=>b.score-a.score);
  const win=ranked[0], me=S.players[0];
  const title = win===me && (ranked.length<2 || ranked[1].score<me.score) ? "You win! 🎉" : (ranked[1] && ranked[1].score===win.score ? "It's a tie" : `${win.name} wins`);
  const youWon = win===me && !(ranked[1] && ranked[1].score===me.score);
  if (!S.endCat){ const c=cpuCats(); S.endCat = youWon ? (c.length?c[rnd(c.length)].cat:GameCats.randomCat()) : (win.cat||anyCat()||GameCats.randomCat()); S.endLine=GameCats.line(youWon?"win":"lose",S.endCat); save(); }
  dialog(`<img class="cat big" src="${GameCats.img(S.endCat)}" alt=""><h2 style="text-align:center">${title}</h2><p style="text-align:center;margin-top:-4px">${S.endLine}</p>${S.calledMsg?`<p style="text-align:center">${S.calledMsg}</p>`:""}<table class="res">${ranked.map(p=>`<tr><td>${p.name}</td><td>${p.score}</td></tr>`).join("")}</table>${S.statLine?`<p>${S.statLine}</p>`:""}
    <div class="stack"><button class="btn primary" id="again">Play again</button><button class="btn" id="statB">Stats</button><button class="btn" id="viewB">View board</button></div>`);
  $("statB").onclick=()=>{ statsBack=showResults; showStats(); };
  $("again").onclick=()=>{clearSaved();showStart();};
  $("viewB").onclick=closeDialog;
}

// ---------- Buttons ----------
$("playBtn").onclick=play;
$("recallBtn").onclick=()=>{ recall(); render(); setMsg("Your turn."); };
$("shuffleBtn").onclick=()=>{ if(!S) return; selected=-1; shuffle(S.players[0].rack); render(); };
$("hintBtn").onclick=()=>{
  if (!myTurn() || S.hintsLeft===0) return;
  recall();
  const me=S.players[0];
  const moves=genMoves(S.board,me.rack).sort((a,b)=>b.score-a.score);
  if (!moves.length){ render(); checkStuck(); return; }
  const m=moves[0];
  for (const t of m.tiles){ const orig=t.b?"?":t.l; const i=me.rack.indexOf(orig); me.rack.splice(i,1); pending.push({idx:t.idx,l:t.l,b:t.b,orig}); }
  if (S.hintsLeft>0){ S.hintsLeft--; const keep=me.rack.slice(); me.rack=keep.concat(pending.map(p=>p.orig)); save(); me.rack=keep; }
  render();
  setMsg(`Hint: <b>${m.word}</b> for ${m.score}. Tap Play to use it, or Recall.${S.hintsLeft>0?` (${S.hintsLeft} left)`:S.hintsLeft===0?" (last one!)":""}`);
};
$("passBtn").onclick=()=>{
  if (!myTurn()) return;

$("swapBtn").onclick=()=>{

$("lookBtn").onclick=()=>{

// ---------- Stats ----------
const STATS_KEY="wordrack-stats-v1";
let statsBack=null;
function blankStats(){ return {records:{},games:0,totalScore:0,streak:0,bestStreak:0,highScore:0,bestWord:null}; }
let STATS=null;
function loadStats(){ return JSON.parse(JSON.stringify(STATS||blankStats())); }
function saveStats(st){ st.savedAt=Date.now(); STATS=st; writeLocal(STATS_KEY,st); cloudWrite("stats",{stats:JSON.stringify(st),savedAt:st.savedAt}); }
function noteBestWord(word,score){
  const st=loadStats();
  if (!st.bestWord || score>st.bestWord.score){ st.bestWord={word,score}; saveStats(st); }
}
function recordResult(){
  const st=loadStats(), me=S.players[0];
  const best=Math.max(...S.players.slice(1).map(p=>p.score));
  const res = me.score>best ? "w" : me.score===best ? "t" : "l";
  const key=`${S.level}|${S.players.length-1}`;
  const r=st.records[key]||(st.records[key]={w:0,l:0,t:0}); r[res]++;
  st.games++; st.totalScore+=me.score; st.highScore=Math.max(st.highScore,me.score);
  if (res==="w"){ st.streak++; st.bestStreak=Math.max(st.bestStreak,st.streak); } else if (res==="l") st.streak=0;
  saveStats(st); return {res,st};
}
function showStats(){
  const st=loadStats(); let w=0,l=0,t=0;
  for (const k in st.records){ w+=st.records[k].w; l+=st.records[k].l; t+=st.records[k].t; }
  const pct = st.games ? Math.round(100*w/st.games)+"%" : "–";
  const rows=[];
  for (let lv=0;lv<4;lv++) for (let n=1;n<=3;n++){ const r=st.records[`${lv}|${n}`]; if (r) rows.push(`<tr><td>${LEVELS[lv]} · ${n} CPU</td><td>${r.w}–${r.l}${r.t?"–"+r.t:""}</td></tr>`); }
  dialog(`<h2>Your stats</h2>
    <table class="res">
      <tr><td>Record (W–L${t?"–T":""})</td><td>${w}–${l}${t?"–"+t:""}</td></tr>
      <tr><td>Win rate</td><td>${pct}</td></tr>
      <tr><td>Current win streak</td><td>${st.streak}</td></tr>
      <tr><td>Best win streak</td><td>${st.bestStreak}</td></tr>
      <tr><td>High score</td><td>${st.highScore||"–"}</td></tr>
      <tr><td>Average score</td><td>${st.games?Math.round(st.totalScore/st.games):"–"}</td></tr>
      <tr><td>Best play</td><td>${st.bestWord?`${st.bestWord.word} (${st.bestWord.score})`:"–"}</td></tr>
    </table>
    ${rows.length?`<div class="lbl">By difficulty</div><table class="res">${rows.join("")}</table>`:`<p>Finish a game to start your record.</p>`}
    <div class="stack"><button class="btn primary" id="sClose">Close</button>
    <button class="btn" id="sExport">Export stats (backup)</button>
    <button class="btn" id="sImport">Import stats</button>
    <button class="btn" id="sReset">Reset stats</button></div>`);
  $("sClose").onclick=()=>{ statsBack?statsBack():closeDialog(); };
  $("sExport").onclick=()=>{
    const code="WR1:"+btoa(unescape(encodeURIComponent(JSON.stringify(st))));
    dialog(`<h2>Export stats</h2><p>Copy this code and keep it somewhere safe (like Notes). Paste it into Import to restore your stats.</p>
      <textarea id="eCode" readonly style="width:100%;height:110px;font-size:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px">${code}</textarea>
      <p id="eMsg"></p><div class="stack"><button class="btn primary" id="eCopy">Copy code</button><button class="btn" id="eBack">Back</button></div>`);
    $("eCopy").onclick=()=>{
      const ta=$("eCode"); ta.focus(); ta.select();
      const ok=()=>{$("eMsg").textContent="Copied ✓";}, fail=()=>{$("eMsg").textContent="Couldn't copy automatically — the code is selected, so long-press and choose Copy.";};
      try{ navigator.clipboard.writeText(code).then(ok,()=>{ try{ document.execCommand("copy")?ok():fail(); }catch(e){fail();} }); }catch(e){ fail(); }
    };
    $("eBack").onclick=showStats;
  };
  $("sImport").onclick=()=>{
    dialog(`<h2>Import stats</h2><p>Paste a code from Export. This replaces your current stats.</p>
      <textarea id="iCode" style="width:100%;height:110px;font-size:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px"></textarea>
      <p id="iMsg"></p><div class="stack"><button class="btn primary" id="iGo">Import</button><button class="btn" id="iBack">Back</button></div>`);
    $("iGo").onclick=()=>{
      try{
        const raw=$("iCode").value.trim(); if (!raw.startsWith("WR1:")) throw 0;
        const obj=JSON.parse(decodeURIComponent(escape(atob(raw.slice(4))))); if (!obj || typeof obj.records!=="object") throw 0;
        saveStats(Object.assign(blankStats(),obj)); showStats();
      }catch(e){ $("iMsg").textContent="That code doesn't look right — make sure you pasted all of it."; }
    };
    $("iBack").onclick=showStats;
  };
  $("sReset").onclick=()=>{
    dialog(`<h2>Reset all stats?</h2><p>This can't be undone. Export a backup first if you might want them back.</p>
      <div class="stack"><button class="btn primary" id="rYes">Reset</button><button class="btn" id="rNo">Cancel</button></div>`);
    $("rYes").onclick=()=>{ saveStats(blankStats()); showStats(); };
    $("rNo").onclick=showStats;
  };
}

// ---------- Theme ----------
const THEME_KEY="wordrack-theme";
function isDark(){ return document.documentElement.dataset.theme==="dark"; }
function setTheme(t){ document.documentElement.dataset.theme=t; try{ localStorage.setItem(THEME_KEY,t); }catch(e){} }
(function(){ let t=null; try{ t=localStorage.getItem(THEME_KEY); }catch(e){}
  if (!t) t=(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  document.documentElement.dataset.theme=t; })();

// ---------- Drag and drop ----------
let drag=null, suppressClick=false, ghost=null, hoverEl=null;
const LIFT=34; // ghost floats above the finger so you can see it
function setHover(el){ if (hoverEl===el) return; if (hoverEl) hoverEl.classList.remove("hover"); hoverEl=el; if (el) el.classList.add("hover"); }
function overRack(x,y){ const r=$("rack").getBoundingClientRect(); return y>=r.top-12 && y<=r.bottom+24 && x>=r.left-10 && x<=r.right+10; }
function cellAt(x,y){ const el=document.elementFromPoint(x,y-LIFT); return el && el.closest ? el.closest("#board .cell") : null; }
function rackInsertIndex(x, skip){
  let k=0; [...$("rack").children].forEach((el,i)=>{ if (i===skip) return; const r=el.getBoundingClientRect(); if (r.left+r.width/2<x) k++; });
  return k;
}
window.addEventListener("pointerdown",e=>{
  if (!S || S.over || drag || !$("dialog").classList.contains("hidden")) return;
  const rt=e.target.closest && e.target.closest("#rack .rt");
  const pt=e.target.closest && e.target.closest("#board .t.pend");
  let src=null;
  if (rt){ const i=+rt.dataset.i; const l=S.players[0].rack[i]; src={type:"rack",i,el:rt,label:l==="?"?"":l}; }
  else if (pt && myTurn()){ const idx=+pt.closest(".cell").dataset.i; const p=pending.find(q=>q.idx===idx); if (p) src={type:"board",idx,el:pt,label:p.l}; }
  if (src && !pinch) drag={src,x0:e.clientX,y0:e.clientY,id:e.pointerId,active:false};
});
window.addEventListener("pointermove",e=>{
  if (!drag || e.pointerId!==drag.id) return;
  const x=e.clientX, y=e.clientY;
  if (!drag.active){
    if (Math.hypot(x-drag.x0,y-drag.y0)<8) return;
    drag.active=true;
    ghost=document.createElement("div"); ghost.id="ghost"; ghost.textContent=drag.src.label; document.body.appendChild(ghost);
    drag.src.el.classList.add("dragging");
  }
  e.preventDefault();
  const w=ghost.offsetWidth;
  ghost.style.transform=`translate(${x-w/2}px,${y-LIFT-w/2}px)`;
  if (zoom>1.05){
    const wrap=$("boardWrap"), r=wrap.getBoundingClientRect(), py=y-LIFT, E=28, V=14;
    if (py>r.top-10 && py<r.bottom+10 && x>r.left-10 && x<r.right+10){
      if (x<r.left+E) wrap.scrollLeft-=V; else if (x>r.right-E) wrap.scrollLeft+=V;
      if (py<r.top+E) wrap.scrollTop-=V; else if (py>r.bottom-E) wrap.scrollTop+=V;
    }
  }
  if (overRack(x,y)) setHover($("rack"));
  else { const c=cellAt(x,y); const i=c?+c.dataset.i:-1; setHover(c && !S.board[i] && myTurn() ? c : null); }
},{passive:false});
function endDrag(){ if (ghost){ ghost.remove(); ghost=null; } setHover(null); if (drag && drag.src.el) drag.src.el.classList.remove("dragging"); }
window.addEventListener("pointercancel",e=>{ if (drag && e.pointerId===drag.id){ endDrag(); drag=null; } });
window.addEventListener("pointerup",e=>{
  if (!drag || e.pointerId!==drag.id) return;
  const d=drag; if (!d.active){ drag=null; return; }
  endDrag(); drag=null;
  suppressClick=true; setTimeout(()=>{ suppressClick=false; },50);
  const x=e.clientX, y=e.clientY, me=S.players[0];
  if (overRack(x,y)){
    if (d.src.type==="rack"){
      const k=rackInsertIndex(x,d.src.i); const [l]=me.rack.splice(d.src.i,1); me.rack.splice(k,0,l);
    } else {
      const k=rackInsertIndex(x,-1); const pi=pending.findIndex(p=>p.idx===d.src.idx);
      if (pi>=0){ me.rack.splice(k,0,pending[pi].orig); pending.splice(pi,1); }
    }
    selected=-1; render(); if (myTurn()) previewMsg(); return;
  }
  const c=cellAt(x,y);
  if (!c || !myTurn()){ render(); return; }
  const idx=+c.dataset.i;
  if (S.board[idx]){ render(); return; }
  const other=pending.find(p=>p.idx===idx);
  if (d.src.type==="board"){
    if (idx===d.src.idx){ render(); return; }
    const mine=pending.find(p=>p.idx===d.src.idx);
    if (other) other.idx=d.src.idx;
    mine.idx=idx; render(); previewMsg();
  } else {
    if (other){ me.rack.push(other.orig); pending.splice(pending.indexOf(other),1); }
    selected=d.src.i; placeAt(idx);
  }
});


// ---------- Board zoom (pinch or the +/− button; rack and buttons stay put) ----------
let zoom=1, pinch=null;
function setZoom(z,cx,cy){
  const wrap=$("boardWrap"); z=Math.max(1,Math.min(2.6,z));
  if (cx==null){ cx=wrap.clientWidth/2; cy=wrap.clientHeight/2; }
  const fx=(wrap.scrollLeft+cx)/zoom, fy=(wrap.scrollTop+cy)/zoom;
  zoom=z; $("board").style.setProperty("--z",z);
  wrap.scrollLeft=fx*z-cx; wrap.scrollTop=fy*z-cy;
  if ($("zoomBtn")) $("zoomBtn").textContent = z>1.05 ? "−" : "🔍";
}
function zoomClick(){
  if (zoom>1.05){ setZoom(1); return; }
  // zoom in around the most recent play (or the center)
  const wrap=$("boardWrap"), idxs=(S&&S.last&&S.last.length)?S.last:[CENTER];
  const r=idxs.reduce((a,i)=>a+Math.floor(i/N),0)/idxs.length, c=idxs.reduce((a,i)=>a+i%N,0)/idxs.length;
  setZoom(1); setZoom(2);
  const cell=wrap.scrollWidth/N;
  wrap.scrollLeft=(c+0.5)*cell-wrap.clientWidth/2; wrap.scrollTop=(r+0.5)*cell-wrap.clientHeight/2;
};
(function(){
  const wrap=$("boardWrap");
  const dist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  wrap.addEventListener("touchstart",e=>{
    if (e.touches.length===2){
      if (drag){ endDrag(); drag=null; }
      pinch={d:dist(e.touches[0],e.touches[1]), z:zoom}; e.preventDefault();
    }
  },{passive:false});
  wrap.addEventListener("touchmove",e=>{
    if (!pinch || e.touches.length!==2) return;
    e.preventDefault();
    const [a,b]=e.touches, r=wrap.getBoundingClientRect();
    setZoom(pinch.z*dist(a,b)/pinch.d,(a.clientX+b.clientX)/2-r.left,(a.clientY+b.clientY)/2-r.top);
  },{passive:false});
  wrap.addEventListener("touchend",e=>{ if (e.touches.length<2) pinch=null; });
  // Stop the whole page from zooming (iOS Safari)
  for (const ev of ["gesturestart","gesturechange","gestureend"]) document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
})();

// ---------- Offline + storage ----------
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if ("serviceWorker" in navigator) window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });

// ---------- Boot ----------
buildBoard();
Promise.all([loadDict(), initStorage()]).then(()=>{
  $("loading").remove();
  const saved=loadSaved();
  if (saved && !saved.over) resume(saved); else showStart();
}).catch(()=>{ $("loading").textContent="Couldn't load the dictionary. Please reload the page."; });
</script>
