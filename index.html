<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Room">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1916">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Game Room</title>
<script>
  (function(){ let t=null; try{ t=localStorage.getItem("wordrack-theme"); }catch(e){}
    if(!t) t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
    document.documentElement.dataset.theme=t; })();
</script>
<style>
  :root{--bg:#f4efe6;--ink:#2b2621;--muted:#7a6f63;--line:#d6c9b1;--panel:#fff8ec;--accent:#2f6f5e}
  :root[data-theme=dark]{--bg:#1b1916;--ink:#efe7da;--muted:#a39886;--line:#3e3933;--panel:#26231f;--accent:#3d8a75}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:480px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:24px}
  .hero img{width:110px;height:110px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px #ead39f,0 4px 14px rgba(0,0,0,.25)}
  .hero h1{margin:14px 0 2px;font-size:28px}
  .hero p{margin:0;color:var(--muted);font-size:14px}
  .game{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none;margin-bottom:12px}
  .game .ic{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex:0 0 auto}
  .game b{display:block;font-size:18px}
  .game span{font-size:13px;color:var(--muted)}
  .game .go{margin-left:auto;font-size:22px;color:var(--muted)}
  .game.soon{opacity:.5;pointer-events:none}
  .badge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;vertical-align:2px}
  .foot{display:flex;justify-content:center;margin-top:18px}
  .foot button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<main>
  <div class="hero">
    <img src="icon-192.png" alt="Glorg">
    <h1>Game Room</h1>
    <p>Supervised by Glorg</p>
  </div>
  <a class="game" href="wordrack.html">
    <div class="ic" style="background:#f7e2b0;color:#2b2621">W</div>
    <div><b>Word Rack<span class="badge" id="wrB" hidden>In progress</span></b><span>Crossword tiles vs. the computer</span></div>
    <div class="go">›</div>
  </a>
  <a class="game" href="hearts.html">
    <div class="ic" style="background:#2f6b55;color:#fff">♥</div>
    <div><b>Hearts<span class="badge" id="hB" hidden>In progress</span></b><span>Cards vs. 3 computer players</span></div>
    <div class="go">›</div>
  </a>
  <div class="game soon">
    <div class="ic" style="background:#3f7fae;color:#fff">9</div>
    <div><b>Sudoku</b><span>Coming soon</span></div>
  </div>
  <div class="foot"><button id="theme"></button></div>
</main>
<script>
  function get(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
  const wr=get("wordrack-save-v1"), hr=get("hearts-save-v1");
  if (wr && !wr.over) document.getElementById("wrB").hidden=false;
  if (hr && !hr.over && hr.hands) document.getElementById("hB").hidden=false;
  const tb=document.getElementById("theme");
  const lab=()=>tb.textContent=document.documentElement.dataset.theme==="dark"?"☀️ Light mode":"🌙 Dark mode";
  lab(); tb.onclick=()=>{ const t=document.documentElement.dataset.theme==="dark"?"light":"dark"; document.documentElement.dataset.theme=t; try{localStorage.setItem("wordrack-theme",t);}catch(e){} lab(); };
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  if ("serviceWorker" in navigator) window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
</script>
</body>
</html>
